name: Build Workflow

permissions:
    contents: write

on:
    push
        #branches: master

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Install Python
          uses: actions/setup-python@v4
          with:
            python-version: "3.x"

        - name: Install PyInstaller
          run: |
              python -m pip install --upgrade pip
              pip install pyinstaller
            
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
                
        - name: Build with Pyinstaller
          run: |
            pyinstaller main.spec --clean
              
        - name: Rename executable
          run: |
            if [[ "$RUNNER_OS" == "Windows" ]]; then
                mv dist/app.exe dist/app-windows.exe
            elif [[ "RUNNER_OS" == "macOS" ]]; then
                mv dist/app dist/app-macos
            fi
          shell: bash
            
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: Item-Creation-Wizard-${{ matrix.os }}
            path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      
      - name: List downloaded files (Debugging)
        run: ls -R
      
      - name: Make files executable (Mac)
        run: chmod +x app-* || true
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            app-windows.exe
            app-macos